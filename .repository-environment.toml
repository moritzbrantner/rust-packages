schema_version = 1

[policy]
track = "latest-stable"

[system]
apt = []

[setup]
commands = [
  "bun install --frozen-lockfile",
  "rustup target add wasm32-unknown-unknown",
  "bash scripts/install-wasm-pack.sh",
  "cargo fetch --locked"
]

[maintenance]
commands = [
  "bun install --frozen-lockfile",
  "rustup target add wasm32-unknown-unknown",
  "bash scripts/install-wasm-pack.sh",
  "cargo fetch --locked"
]

[cache]
paths = ["~/.cargo", "~/.bun/install/cache"]

[compatibility_holds]
