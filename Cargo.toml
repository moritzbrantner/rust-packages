video-analysis-data.workspace = true
video-analysis-dataset.workspace = true
video-analysis-detectors.workspace = true
video-analysis-editing.workspace = true
video-analysis-features.workspace = true
video-analysis-ffmpeg.workspace = true
video-analysis-gaussian-splatting.workspace = true
video-analysis-ingest.workspace = true
video-analysis-models.workspace = true
video-analysis-onnx = { workspace = true, optional = true }
video-analysis-output.workspace = true
video-analysis-posture.workspace = true
video-analysis-radiance-fields.workspace = true
video-analysis-radiance-io.workspace = true
video-analysis-radiance-pipeline.workspace = true
video-analysis-recognition.workspace = true
video-analysis-reconstruction.workspace = true
video-analysis-split.workspace = true
video-analysis-storage.workspace = true
video-analysis-synthesis.workspace = true
video-analysis-tracking.workspace = true
video-analysis-transform.workspace = true
audio-analysis-core.workspace = true
audio-analysis-fourier.workspace = true
audio-analysis-io.workspace = true
audio-analysis-pitch.workspace = true
audio-analysis-processing.workspace = true
audio-analysis-recognition.workspace = true
audio-analysis-rhythm.workspace = true
audio-analysis-separation.workspace = true
audio-analysis-synthesis.workspace = true
data-inversion-core.workspace = true
dense-data.workspace = true
image-analysis-core.workspace = true
image-analysis-processing.workspace = true
image-analysis-synthesis.workspace = true
text-analysis-core.workspace = true
text-analysis-corpus.workspace = true
text-analysis-features.workspace = true
text-analysis-models.workspace = true
text-analysis-prediction.workspace = true
text-analysis-semantics.workspace = true
text-analysis-synthesis.workspace = true
text-analysis-transcription.workspace = true
