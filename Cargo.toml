[package]
name = "video-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust-first multimodal analysis workspace for video, audio, images, text, vectors, and 3D processing."

[workspace]
members = [
    ".",
    "crates/audio/audio-analysis-core",
    "crates/audio/audio-analysis-fourier",
    "crates/audio/audio-analysis-io",
    "crates/audio/audio-analysis-pitch",
    "crates/audio/audio-analysis-processing",
    "crates/audio/audio-analysis-recognition",
    "crates/audio/audio-analysis-rhythm",
    "crates/audio/audio-analysis-separation",
    "crates/audio/audio-analysis-synthesis",
    "crates/audio/audio-analysis-test-support",
    "crates/test-support/video-analysis-test-support",
    "crates/comfyui/comfyui-data",
    "crates/comfyui/comfyui-models",
    "crates/data/data-inversion-core",
    "crates/data/dense-data",
    "crates/image/image-analysis-core",
    "crates/image/image-analysis-processing",
    "crates/image/image-analysis-synthesis",
    "crates/text/text-analysis-corpus",
    "crates/text/text-analysis-core",
    "crates/text/text-analysis-features",
    "crates/text/text-analysis-models",
    "crates/text/text-analysis-prediction",
    "crates/text/text-analysis-semantics",
    "crates/text/text-analysis-synthesis",
    "crates/text/text-analysis-transcription",
    "crates/three-d/three-d-processing-core",
    "crates/three-d/three-d-processing-mesh",
    "crates/vector/vector-analysis-core",
    "crates/vector/vector-analysis-index",
    "crates/video/video-analysis-core",
    "crates/video/video-analysis-data",
    "crates/video/video-analysis-dataset",
    "crates/video/video-analysis-detectors",
    "crates/video/video-analysis-editing",
    "crates/video/video-analysis-features",
    "crates/video/video-analysis-ffmpeg",
    "crates/video/video-analysis-gaussian-splatting",
    "crates/video/video-analysis-ingest",
    "crates/video/video-analysis-models",
    "crates/video/video-analysis-onnx",
    "crates/video/video-analysis-output",
    "crates/video/video-analysis-posture",
    "crates/video/video-analysis-radiance-fields",
    "crates/video/video-analysis-radiance-io",
    "crates/video/video-analysis-radiance-pipeline",
    "crates/video/video-analysis-recognition",
    "crates/video/video-analysis-reconstruction",
    "crates/video/video-analysis-split",
    "crates/video/video-analysis-storage",
    "crates/video/video-analysis-synthesis",
    "crates/video/video-analysis-tracking",
    "crates/video/video-analysis-transform",
    "crates/video/video-analysis-use-cases",
    "crates/video/video-analysis-cli",
]
resolver = "2"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
ffmpeg-next = { version = "8.0.0", default-features = false }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rustfft = "6.2.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
criterion = "0.5.1"
proptest = "1.6.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
tokenizers = "0.22.2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17.2"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
comfyui-data = { path = "crates/comfyui/comfyui-data" }
comfyui-models = { path = "crates/comfyui/comfyui-models" }
data-inversion-core = { path = "crates/data/data-inversion-core" }
dense-data = { path = "crates/data/dense-data" }
audio-analysis-core = { path = "crates/audio/audio-analysis-core" }
audio-analysis-fourier = { path = "crates/audio/audio-analysis-fourier" }
audio-analysis-io = { path = "crates/audio/audio-analysis-io" }
audio-analysis-pitch = { path = "crates/audio/audio-analysis-pitch" }
audio-analysis-processing = { path = "crates/audio/audio-analysis-processing" }
audio-analysis-recognition = { path = "crates/audio/audio-analysis-recognition" }
audio-analysis-rhythm = { path = "crates/audio/audio-analysis-rhythm" }
audio-analysis-separation = { path = "crates/audio/audio-analysis-separation" }
audio-analysis-synthesis = { path = "crates/audio/audio-analysis-synthesis" }
audio-analysis-test-support = { path = "crates/audio/audio-analysis-test-support" }
video-analysis-test-support = { path = "crates/test-support/video-analysis-test-support" }
image-analysis-core = { path = "crates/image/image-analysis-core" }
image-analysis-processing = { path = "crates/image/image-analysis-processing" }
image-analysis-synthesis = { path = "crates/image/image-analysis-synthesis" }
text-analysis-core = { path = "crates/text/text-analysis-core" }
text-analysis-corpus = { path = "crates/text/text-analysis-corpus" }
text-analysis-features = { path = "crates/text/text-analysis-features" }
text-analysis-models = { path = "crates/text/text-analysis-models" }
text-analysis-prediction = { path = "crates/text/text-analysis-prediction" }
text-analysis-semantics = { path = "crates/text/text-analysis-semantics" }
text-analysis-synthesis = { path = "crates/text/text-analysis-synthesis" }
text-analysis-transcription = { path = "crates/text/text-analysis-transcription" }
vector-analysis-core = { path = "crates/vector/vector-analysis-core" }
vector-analysis-index = { path = "crates/vector/vector-analysis-index" }
three-d-processing-core = { path = "crates/three-d/three-d-processing-core" }
three-d-processing-mesh = { path = "crates/three-d/three-d-processing-mesh" }
video-analysis-core = { path = "crates/video/video-analysis-core" }
video-analysis-data = { path = "crates/video/video-analysis-data" }
video-analysis-dataset = { path = "crates/video/video-analysis-dataset" }
video-analysis-detectors = { path = "crates/video/video-analysis-detectors" }
video-analysis-editing = { path = "crates/video/video-analysis-editing" }
video-analysis-features = { path = "crates/video/video-analysis-features" }
video-analysis-ffmpeg = { path = "crates/video/video-analysis-ffmpeg" }
video-analysis-gaussian-splatting = { path = "crates/video/video-analysis-gaussian-splatting" }
video-analysis-ingest = { path = "crates/video/video-analysis-ingest" }
video-analysis-models = { path = "crates/video/video-analysis-models" }
video-analysis-onnx = { path = "crates/video/video-analysis-onnx" }
video-analysis-output = { path = "crates/video/video-analysis-output" }
video-analysis-posture = { path = "crates/video/video-analysis-posture" }
video-analysis-radiance-fields = { path = "crates/video/video-analysis-radiance-fields" }
video-analysis-radiance-io = { path = "crates/video/video-analysis-radiance-io" }
video-analysis-radiance-pipeline = { path = "crates/video/video-analysis-radiance-pipeline" }
video-analysis-recognition = { path = "crates/video/video-analysis-recognition" }
video-analysis-reconstruction = { path = "crates/video/video-analysis-reconstruction" }
video-analysis-split = { path = "crates/video/video-analysis-split" }
video-analysis-storage = { path = "crates/video/video-analysis-storage" }
video-analysis-synthesis = { path = "crates/video/video-analysis-synthesis" }
video-analysis-tracking = { path = "crates/video/video-analysis-tracking" }
video-analysis-transform = { path = "crates/video/video-analysis-transform" }
video-analysis-use-cases = { path = "crates/video/video-analysis-use-cases" }

[features]
default = []
ffmpeg-backend = ["video-analysis-ffmpeg/ffmpeg-backend"]
ffmpeg-tests = ["ffmpeg-backend"]
onnx-backend = ["dep:video-analysis-onnx"]

[dependencies]
