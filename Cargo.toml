[package]
name = "moenarch-video-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust-first multimodal analysis workspace for video, audio, images, text, vectors, and 3D processing."
readme = "README.md"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/rust-packages"
homepage = "https://github.com/moritzbrantner/rust-packages"
documentation = "https://docs.rs/moenarch-video-analysis"
keywords = ["video", "audio", "image", "multimodal", "analysis"]
categories = ["multimedia", "computer-vision", "science", "algorithms"]

[workspace]
members = [
    ".",
    "crates/animation/*",
    "crates/bindings/*",
    "crates/comfyui/*",
    "crates/image/*",
    "crates/test-support/*",
    "crates/three-d/*",
    "crates/video/*",
    "prototypes/rust/video-analysis-use-cases",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/rust-packages"
homepage = "https://github.com/moritzbrantner/rust-packages"
documentation = "https://docs.rs/moenarch-video-analysis"
keywords = ["video", "audio", "image", "multimodal", "analysis"]
categories = ["multimedia", "computer-vision", "science", "algorithms"]

[workspace.dependencies]
base64 = "0.23.0"
clap = { version = "4.5.51", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
ffmpeg-next = { version = "8.0.0", default-features = false }
flate2 = "1.1.9"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
rusqlite = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
regex = "1"
rayon = "1.11.0"
redb = "4.1"
shlex = "1.3.0"
rustfft = "6.2.0"
hound = "3.5.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
criterion = "0.8.0"
faer = { version = "0.24.0", default-features = false, features = ["std", "linalg"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
proptest = "1.6.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
tokenizers = { version = "0.23.0", default-features = false, features = ["unstable_wasm"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
animation-core = { package = "moenarch-animation-core", version = "0.1.0", path = "crates/animation/animation-core" }
comfyui-data = { package = "moenarch-comfyui-data", version = "0.1.0", path = "crates/comfyui/comfyui-data" }
comfyui-latents = { package = "moenarch-comfyui-latents", version = "0.1.0", path = "crates/comfyui/comfyui-latents" }
comfyui-models = { package = "moenarch-comfyui-models", version = "0.1.0", path = "crates/comfyui/comfyui-models" }
# Packages owned by other repositories. Foundation (moenarch-foundation) and NLP
# (nlp-stack) crates use their exact registry coordinates; visual-analysis crates
# come from one pinned visual-analysis revision because several are unpublished.
runtime-core = { package = "moenarch-runtime-core", version = "=0.2.1" }
tensor-data = { package = "moenarch-tensor-data", version = "=0.1.1" }
model-runtime = { package = "moenarch-model-runtime", version = "=0.1.1" }
runtime-onnx = { package = "moenarch-runtime-onnx", version = "=0.1.1" }
math-geometry-2d = { package = "moenarch-math-geometry-2d", version = "=0.1.1" }
jobs-core = { package = "moenarch-jobs-core", version = "=0.1.2" }
text-core = { package = "moenarch-text-core", version = "=0.1.1" }
scenedetect-core = "=0.1.0"
text-lexical = { package = "moenarch-text-lexical", version = "=0.1.1" }
text-transcripts = { package = "moenarch-text-transcripts", version = "=0.1.3" }
image-analysis-core = { package = "moenarch-image-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
image-analysis-detection = { package = "moenarch-image-analysis-detection", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
image-analysis-io = { package = "moenarch-image-analysis-io", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
image-analysis-processing = { package = "moenarch-image-analysis-processing", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-core = { package = "moenarch-video-analysis-core", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-data = { package = "moenarch-video-analysis-data", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-dataset = { package = "moenarch-video-analysis-dataset", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-detectors = { package = "moenarch-video-analysis-detectors", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-ffmpeg = { package = "moenarch-video-analysis-ffmpeg", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-ingest = { package = "moenarch-video-analysis-ingest", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-output = { package = "moenarch-video-analysis-output", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-posture = { package = "moenarch-video-analysis-posture", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-posture-io = { package = "moenarch-video-analysis-posture-io", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-recognition = { package = "moenarch-video-analysis-recognition", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-split = { package = "moenarch-video-analysis-split", git = "https://github.com/moritzbrantner/visual-analysis", rev = "ef820b3c0f0b0c5306274f484c1d26582bd655c4" }
video-analysis-test-support = { package = "moenarch-video-analysis-test-support", version = "0.1.0", path = "crates/test-support/video-analysis-test-support" }
image-analysis-comfyui = { package = "moenarch-image-analysis-comfyui", version = "0.1.0", path = "crates/image/image-analysis-comfyui" }
three-d-processing-core = { package = "moenarch-three-d-processing-core", version = "0.1.0", path = "crates/three-d/three-d-processing-core" }
three-d-processing-io = { package = "moenarch-three-d-processing-io", version = "0.1.0", path = "crates/three-d/three-d-processing-io" }
three-d-processing-mesh = { package = "moenarch-three-d-processing-mesh", version = "0.1.0", path = "crates/three-d/three-d-processing-mesh" }
three-d-scene-svg = { package = "moenarch-three-d-scene-svg", version = "0.1.0", path = "crates/three-d/three-d-scene-svg" }
video-analysis-gaussian-splatting = { package = "moenarch-video-analysis-gaussian-splatting", version = "0.1.0", path = "crates/video/video-analysis-gaussian-splatting" }
video-analysis-mvs = { package = "moenarch-video-analysis-mvs", version = "0.1.0", path = "crates/video/video-analysis-mvs" }
video-analysis-radiance-fields = { package = "moenarch-video-analysis-radiance-fields", version = "0.1.0", path = "crates/video/video-analysis-radiance-fields" }
video-analysis-radiance-io = { package = "moenarch-video-analysis-radiance-io", version = "0.1.0", path = "crates/video/video-analysis-radiance-io" }
video-analysis-radiance-pipeline = { package = "moenarch-video-analysis-radiance-pipeline", version = "0.1.0", path = "crates/video/video-analysis-radiance-pipeline" }
video-analysis-reconstruction = { package = "moenarch-video-analysis-reconstruction", version = "0.1.0", path = "crates/video/video-analysis-reconstruction" }
video-analysis-sfm = { package = "moenarch-video-analysis-sfm", version = "0.1.0", path = "crates/video/video-analysis-sfm" }
video-analysis-use-cases = { package = "moenarch-video-analysis-use-cases", version = "0.1.0", path = "prototypes/rust/video-analysis-use-cases" }

[lib]
name = "video_analysis"

[features]
default = ["full"]
full = ["animation", "three-d", "spatial", "comfyui"]
animation = ["dep:animation-core"]
three-d = [
    "dep:three-d-processing-core",
    "dep:three-d-processing-io",
    "dep:three-d-processing-mesh",
    "dep:three-d-scene-svg",
]
spatial = [
    "dep:video-analysis-gaussian-splatting",
    "dep:video-analysis-mvs",
    "dep:video-analysis-radiance-fields",
    "dep:video-analysis-radiance-io",
    "dep:video-analysis-radiance-pipeline",
    "dep:video-analysis-reconstruction",
    "dep:video-analysis-sfm",
]
comfyui = [
    "dep:comfyui-data",
    "dep:comfyui-latents",
    "dep:comfyui-models",
    "dep:image-analysis-comfyui",
]

[[bin]]
name = "video-analysis-overview-server"
path = "src/bin/video-analysis-overview-server.rs"
required-features = ["full"]

[dependencies]
animation-core = { workspace = true, optional = true }
clap.workspace = true
comfyui-data = { workspace = true, optional = true }
comfyui-latents = { workspace = true, optional = true }
comfyui-models = { workspace = true, optional = true }
image-analysis-comfyui = { workspace = true, optional = true }
runtime-core.workspace = true
serde.workspace = true
serde_json.workspace = true
three-d-processing-core = { workspace = true, optional = true }
three-d-processing-io = { workspace = true, optional = true }
three-d-processing-mesh = { workspace = true, optional = true }
three-d-scene-svg = { workspace = true, optional = true }
video-analysis-gaussian-splatting = { workspace = true, optional = true }
video-analysis-mvs = { workspace = true, optional = true }
video-analysis-radiance-fields = { workspace = true, optional = true }
video-analysis-radiance-io = { workspace = true, optional = true }
video-analysis-radiance-pipeline = { workspace = true, optional = true }
video-analysis-reconstruction = { workspace = true, optional = true }
video-analysis-sfm = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
comfyui-data.workspace = true
comfyui-latents.workspace = true
comfyui-models.workspace = true
num-rational.workspace = true
tensor-data.workspace = true
video-analysis-core.workspace = true
video-analysis-test-support.workspace = true

# visual-analysis's recognition crate needs moenarch-semantic-core, which is not on
# crates.io yet; take it from the foundation revision visual-analysis pins.
[patch.crates-io]
moenarch-semantic-core = { git = "https://github.com/moritzbrantner/moenarch-foundation", rev = "b7533cd02269124deece75b76477ca55a853cd77" }
