[workspace]
members = [
    "crates/linguistics-core",
    "crates/linguistics-phonetics",
    "crates/linguistics-morphology",
    "crates/linguistics-syntax",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/rust-packages"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
