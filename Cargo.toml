[package]
name = "video-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust-first video scene analysis workspace inspired by PySceneDetect."

[workspace]
members = [
    ".",
    "crates/video-analysis-core",
    "crates/video-analysis-data",
    "crates/video-analysis-detectors",
    "crates/video-analysis-ffmpeg",
    "crates/video-analysis-gaussian-splatting",
    "crates/video-analysis-ingest",
    "crates/video-analysis-models",
    "crates/video-analysis-output",
    "crates/video-analysis-radiance-fields",
    "crates/video-analysis-split",
    "crates/video-analysis-use-cases",
    "crates/video-analysis-cli",
]
resolver = "2"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
ffmpeg-next = { version = "8.0.0", default-features = false }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
video-analysis-core = { path = "crates/video-analysis-core" }
video-analysis-data = { path = "crates/video-analysis-data" }
video-analysis-detectors = { path = "crates/video-analysis-detectors" }
video-analysis-ffmpeg = { path = "crates/video-analysis-ffmpeg" }
video-analysis-gaussian-splatting = { path = "crates/video-analysis-gaussian-splatting" }
video-analysis-ingest = { path = "crates/video-analysis-ingest" }
video-analysis-models = { path = "crates/video-analysis-models" }
video-analysis-output = { path = "crates/video-analysis-output" }
video-analysis-radiance-fields = { path = "crates/video-analysis-radiance-fields" }
video-analysis-split = { path = "crates/video-analysis-split" }
video-analysis-use-cases = { path = "crates/video-analysis-use-cases" }

[features]
default = []
ffmpeg-backend = ["video-analysis-ffmpeg/ffmpeg-backend"]
ffmpeg-tests = ["ffmpeg-backend"]

[dependencies]
video-analysis-core.workspace = true
video-analysis-data.workspace = true
video-analysis-detectors.workspace = true
video-analysis-ffmpeg.workspace = true
video-analysis-gaussian-splatting.workspace = true
video-analysis-ingest.workspace = true
video-analysis-models.workspace = true
video-analysis-output.workspace = true
video-analysis-radiance-fields.workspace = true
video-analysis-split.workspace = true
