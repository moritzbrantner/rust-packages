[package]
name = "moritzbrantner-video-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust-first multimodal analysis workspace for video, audio, images, text, vectors, and 3D processing."
readme = "README.md"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/rust-packages"
homepage = "https://github.com/moritzbrantner/rust-packages"
documentation = "https://docs.rs/moritzbrantner-video-analysis"
keywords = ["video", "audio", "image", "multimodal", "analysis"]
categories = ["multimedia", "computer-vision", "science", "algorithms"]

[workspace]
members = [
    ".",
    "crates/animation/*",
    "crates/audio/*",
    "crates/bindings/*",
    "crates/comfyui/*",
    "crates/data/*",
    "crates/image/*",
    "crates/jobs/*",
    "crates/math/*",
    "crates/runtime/runtime-core",
    "crates/runtime/runtime-onnx",
    "crates/runtime/model-runtime",
    "crates/runtime/model-runtime-cli",
    "crates/runtime/model-runtime-server",
    "crates/test-support/*",
    "crates/text/*",
    "crates/three-d/*",
    "crates/vector/*",
    "crates/vision/*",
    "crates/video/*",
    "prototypes/rust/video-analysis-use-cases",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/rust-packages"
homepage = "https://github.com/moritzbrantner/rust-packages"
documentation = "https://docs.rs/moritzbrantner-video-analysis"
keywords = ["video", "audio", "image", "multimodal", "analysis"]
categories = ["multimedia", "computer-vision", "science", "algorithms"]

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
ffmpeg-next = { version = "8.0.0", default-features = false }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
rusqlite = "0.32.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
geojson = "1"
osmpbfreader = "0.16"
regex = "1"
redb = "4.1"
rstar = "0.13"
shlex = "1.3.0"
rustfft = "6.2.0"
hound = "3.5.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
criterion = "0.5.1"
faer = { version = "0.24.0", default-features = false, features = ["std", "linalg"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
proptest = "1.6.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["unstable_wasm"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17.2"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
animation-core = { package = "moritzbrantner-animation-core", version = "0.1.0", path = "crates/animation/animation-core" }
comfyui-data = { package = "moritzbrantner-comfyui-data", version = "0.1.0", path = "crates/comfyui/comfyui-data" }
comfyui-latents = { package = "moritzbrantner-comfyui-latents", version = "0.1.0", path = "crates/comfyui/comfyui-latents" }
comfyui-models = { package = "moritzbrantner-comfyui-models", version = "0.1.0", path = "crates/comfyui/comfyui-models" }
data-inversion-core = { package = "moritzbrantner-data-inversion-core", version = "0.1.0", path = "crates/data/data-inversion-core" }
graph-analysis-core = { package = "moritzbrantner-graph-analysis-core", version = "0.1.0", path = "crates/data/graph-analysis-core" }
geo-core = { package = "moritzbrantner-geo-core", version = "0.1.0", path = "crates/data/geo-core" }
geo-io-geojson = { package = "moritzbrantner-geo-io-geojson", version = "0.1.0", path = "crates/data/geo-io-geojson" }
