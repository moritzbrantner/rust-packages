<!doctype html>
<meta charset="utf-8" />
<title>maps-kernels-wasm benchmark</title>
<script type="module">
  import init, { resampleLineFlat, resampleRingFlat } from "../index.js";

  const sizes = [32, 128, 512, 2048, 8192, 32768];

  globalThis.runMapsKernelsWasmBench = async function runMapsKernelsWasmBench() {
    const initStartedAt = performance.now();

    await init();

    const initMs = performance.now() - initStartedAt;
    const results = [];

    for (const size of sizes) {
      const line = createLine(size);
      const ring = createRing(size);

      results.push(measure(`wasm.resampleLineFlat.${size}`, () => resampleLineFlat(line, Math.min(size, 1024))));
      results.push(measure(`wasm.resampleRingFlat.${size}`, () => resampleRingFlat(ring, Math.min(size, 1024))));
    }

    return {
      initMs,
      results,
      userAgent: navigator.userAgent,
    };
  };

  function measure(name, run) {
    const iterations = 50;
    const startedAt = performance.now();
    let outputCount = 0;

    for (let index = 0; index < iterations; index += 1) {
      outputCount = run().length / 2;
    }

    const totalMs = performance.now() - startedAt;

    return {
      averageMs: totalMs / iterations,
      iterations,
      name,
      outputCount,
      totalMs,
    };
  }

  function createLine(count) {
    const coordinates = new Float64Array(count * 2);

    for (let index = 0; index < count; index += 1) {
      const progress = count === 1 ? 0 : index / (count - 1);

      coordinates[index * 2] = progress * 120;
      coordinates[index * 2 + 1] = progress * 20 + Math.sin(progress * Math.PI * 6) * 3;
    }

    return coordinates;
  }

  function createRing(count) {
    const coordinates = new Float64Array(count * 2);

    for (let index = 0; index < count; index += 1) {
      const angle = (index / count) * Math.PI * 2;
      const radius = 20 * (1 + 0.14 * Math.sin(angle * 5));

      coordinates[index * 2] = Math.cos(angle) * radius;
      coordinates[index * 2 + 1] = Math.sin(angle) * radius;
    }

    return coordinates;
  }
</script>
