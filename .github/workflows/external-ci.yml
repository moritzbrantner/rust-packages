name: external-ci

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e-external:
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0 && rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0 && bash scripts/setup_e2e_external_tools.sh fast && bash scripts/check_e2e_external_tools.sh
      e2e_command: bash scripts/check-e2e.sh
      install_playwright: true
      cache_cargo: true
      timeout_minutes: 90
      artifact_paths: |
        packages/video-analysis-ui/playwright-report
        packages/video-analysis-ui/test-results
        prototypes/web/video-analysis-web/playwright-report
        prototypes/web/video-analysis-web/test-results
