name: external-ci

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 1"

jobs:
  e2e-external:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="AUTHORIZATION: Bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/setup_e2e_external_tools.sh fast
      - run: bash scripts/check_e2e_external_tools.sh
      - run: bash scripts/check-e2e.sh
