name: Format media annotation candidate

on:
  pull_request:
    paths:
      - "crates/media/media-core/src/annotations.rs"
      - ".github/workflows/format-media-annotations.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/media-annotations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format candidate
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/media/media-core/src/annotations.rs
          git commit -m "style: format media annotations"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
