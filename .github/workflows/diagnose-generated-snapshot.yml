name: Diagnose generated snapshot

on:
  push:
    branches:
      - chore/repository-foundation-v1
    paths:
      - .github/workflows/diagnose-generated-snapshot.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: chore/repository-foundation-v1
      - name: Fetch main
        run: git fetch origin main
      - name: State before setup
        run: |
          echo '=== status ==='
          git status --short
          echo '=== PR diff names ==='
          git diff --name-only origin/main...HEAD
          echo '=== README diff ==='
          git diff -- README.md
          git diff origin/main...HEAD -- README.md
      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup
      - name: State after setup
        run: |
          echo '=== status ==='
          git status --short
          echo '=== README diff ==='
          git diff -- README.md
      - name: Run conformance diagnostically
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@c9e071995abf65d2326930efb05e47e585af0efd
        with:
          operation: conformance
          bun-version: 1.3.14
          install-mode: none
          report-path: .artifacts/coding-tooling/conformance.json
      - name: State after conformance
        if: always()
        run: |
          echo '=== status ==='
          git status --short
          echo '=== README diff ==='
          git diff -- README.md
          echo '=== report ==='
          cat .artifacts/coding-tooling/conformance.json || true
