name: performance-ci

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  performance:
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0 && rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0 && bunx playwright install --with-deps chromium
      build_command: bun run web:build:deps
      benchmark_command: bun run bench
      cache_cargo: true
      timeout_minutes: 120
      artifact_paths: |
        target/criterion
        .cargo-target/criterion
        benchmark-results
        performance-results
