name: Foundation Tool Lock Preview

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/foundation-tool-lock-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Regenerate Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install
          git diff -- package.json bun.lock
          exit 1
