name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    name: Build or reuse Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      source_sha: ${{ github.sha }}
      artifact_key: rust-packages-video-analysis-pages-v1
      node_version: ""
      bun_version: "1.3.14"
      cache_bun: true
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile --ignore-scripts
        bun scripts/configure_pages_base_path.ts
      build_command: bun run ui:build && bun run web:build:pages
      artifact_paths: prototypes/web/video-analysis-web/dist
      reuse_across_runs: true
      artifact_retention_days: 7

  deploy:
    needs: build-pages
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      build_command: ""
      artifact_path: prototypes/web/video-analysis-web/dist
      prebuilt_artifact_run_id: ${{ needs.build-pages.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-pages.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-pages.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-pages.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-pages.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-pages.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
      concurrency_group: pages
      cancel_in_progress: true
