name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-context:
    name: Resolve Pages build context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Resolve Pages base path
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          owner, repo = repository.split("/", 1)
          request = urllib.request.Request(
              f"{api_url}/repos/{repository}/pages",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              base_url = str(payload.get("html_url") or "").rstrip("/")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              base_url = ""

          if not base_url:
              is_user_or_organization_site = repo.lower() == f"{owner.lower()}.github.io"
              base_url = f"https://{owner}.github.io{'' if is_user_or_organization_site else f'/{repo}'}"

          base_path = urlparse(base_url).path.rstrip("/")
          pages_base_path = f"{base_path}/"
          if not pages_base_path.startswith("/"):
              pages_base_path = f"/{pages_base_path}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"base_path={pages_base_path}\n")

          print(f"Resolved GitHub Pages base path: {pages_base_path}")
          PY

  build-pages:
    name: Build or reuse Pages artifact
    needs: pages-context
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      source_sha: ${{ github.sha }}
      artifact_key: rust-packages-video-analysis-pages-v1
      node_version: ""
      bun_version: "1.3.14"
      cache_bun: true
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile --ignore-scripts
        printf 'PAGES_BASE_PATH=%s\n' '${{ needs.pages-context.outputs.base_path }}' >> "$GITHUB_ENV"
      build_command: bun run ui:build && bun run web:build:pages
      artifact_paths: prototypes/web/video-analysis-web/dist
      reuse_across_runs: true
      artifact_retention_days: 7

  deploy:
    needs: build-pages
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      build_command: ""
      artifact_path: prototypes/web/video-analysis-web/dist
      prebuilt_artifact_run_id: ${{ needs.build-pages.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-pages.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-pages.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-pages.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-pages.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-pages.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
      concurrency_group: pages
      cancel_in_progress: true
