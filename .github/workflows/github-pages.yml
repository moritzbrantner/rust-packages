name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile --ignore-scripts
      pre_command: bun scripts/configure_pages_base_path.ts
      build_command: bun run ui:build && bun run web:build:pages
      artifact_path: prototypes/web/video-analysis-web/dist
      concurrency_group: pages
      cancel_in_progress: true
