name: github-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Bun
        env:
          BUN_VERSION: 1.3.14
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) bun_target=bun-linux-x64 ;;
            aarch64|arm64) bun_target=bun-linux-aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${bun_target}.zip" -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${bun_target}" >> "$GITHUB_PATH"
      - name: Checkout repository with Bun
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bun-checkout.ts" <<'BUN'
          const workspace = process.env.GITHUB_WORKSPACE;
          const repository = process.env.GITHUB_REPOSITORY;
          const serverUrl = process.env.GITHUB_SERVER_URL ?? "https://github.com";
          const ref = process.env.GITHUB_REF;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GITHUB_TOKEN;

          if (!workspace || !repository || !ref) {
            throw new Error("GITHUB_WORKSPACE, GITHUB_REPOSITORY, and GITHUB_REF are required");
          }

          const remote = new URL(`${serverUrl.replace(/\/$/, "")}/${repository}.git`);
          if (remote.protocol === "https:" && token) {
            remote.username = "x-access-token";
            remote.password = token;
          }

          function git(...args: string[]) {
            const result = Bun.spawnSync(["git", ...args], {
              env: { ...process.env, GIT_TERMINAL_PROMPT: "0" },
              stdin: "inherit",
              stdout: "inherit",
              stderr: "inherit",
            });
            if (result.exitCode !== 0) {
              throw new Error(`git ${args.join(" ")} failed with status ${result.exitCode}`);
            }
          }

          git("init", workspace);
          git("-C", workspace, "config", "--global", "--add", "safe.directory", workspace);
          git("-C", workspace, "config", "--local", "gc.auto", "0");
          git("-C", workspace, "config", "--local", "advice.detachedHead", "false");
          Bun.spawnSync(["git", "-C", workspace, "remote", "remove", "origin"], { stdout: "ignore", stderr: "ignore" });
          git("-C", workspace, "remote", "add", "origin", remote.toString());
          git("-C", workspace, "fetch", "--force", "--no-tags", "--prune", "--no-recurse-submodules", "--depth=1", "origin", `+${ref}:refs/github-actions/checkout`);
          git("-C", workspace, "checkout", "--force", "--detach", sha ?? "refs/github-actions/checkout");
          BUN
          bun "$RUNNER_TEMP/bun-checkout.ts"
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Pages with Bun
        id: pages-config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/configure-pages.ts" <<'BUN'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const apiUrl = process.env.GITHUB_API_URL ?? "https://api.github.com";

          if (!repository) {
            throw new Error("GITHUB_REPOSITORY is required");
          }

          const [owner, repo] = repository.split("/");
          let baseUrl = "";

          if (token) {
            const response = await fetch(`${apiUrl}/repos/${repository}/pages`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });

            if (response.ok) {
              const pages = await response.json();
              baseUrl = String(pages.html_url ?? "").replace(/\/$/, "");
            } else if (response.status !== 404) {
              throw new Error(`GitHub Pages metadata request failed with status ${response.status}`);
            }
          }

          if (!baseUrl) {
            const isUserOrOrganizationSite = repo.toLowerCase() === `${owner.toLowerCase()}.github.io`;
            baseUrl = `https://${owner}.github.io${isUserOrOrganizationSite ? "" : `/${repo}`}`;
          }

          const url = new URL(baseUrl);
          const basePath = url.pathname.replace(/\/$/, "");
          const pagesBasePath = `${basePath}/`.replace(/^\/?/, "/");

          const outputPath = process.env.GITHUB_OUTPUT!;
          const envPath = process.env.GITHUB_ENV!;
          const existingOutput = await Bun.file(outputPath).text().catch(() => "");
          const existingEnv = await Bun.file(envPath).text().catch(() => "");

          await Bun.write(outputPath, existingOutput + [
            `base_url=${baseUrl}`,
            `origin=${url.origin}`,
            `host=${url.host}`,
            `base_path=${basePath}`,
            "",
          ].join("\n"));
          await Bun.write(envPath, `${existingEnv}PAGES_BASE_PATH=${pagesBasePath}\n`);
          console.log(`Configured GitHub Pages base path: ${pagesBasePath}`);
          BUN
          bun "$RUNNER_TEMP/configure-pages.ts"
      - name: Verify GitHub Packages token
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PACKAGES_TOKEN:-}" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty; configure a token with read access to @moritzbrantner/ui."
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_PACKAGES_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://npm.pkg.github.com/@moritzbrantner%2Fui")"
          if [ "${status}" != "200" ]; then
            echo "::error::GH_PACKAGES_TOKEN cannot read @moritzbrantner/ui from GitHub Packages (HTTP ${status})."
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      - run: bun run ui:build
      - run: bun run web:build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/web/video-analysis-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
