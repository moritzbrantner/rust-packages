name: Repair Cargo lockfile

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/repository-foundation-v1
      - id: state
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "fix: refresh Cargo lockfile for pinned environment" ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.state.outputs.done != 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      - name: Refresh lockfile minimally
        if: steps.state.outputs.done != 'true'
        run: cargo +1.95.0 fetch
      - name: Prove frozen lockfile
        if: steps.state.outputs.done != 'true'
        run: cargo +1.95.0 fetch --locked
      - name: Commit repaired lockfile
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          git diff --exit-code -- Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix: refresh Cargo lockfile for pinned environment"
          git push origin HEAD:chore/repository-foundation-v1
