name: audio-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt && rustup default 1.95.0
      lint_command: cargo clippy -p moenarch-audio-analysis-core -p moenarch-audio-analysis-fourier -p moenarch-audio-analysis-io -p moenarch-audio-analysis-pitch -p moenarch-audio-analysis-processing -p moenarch-audio-analysis-recognition -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-separation --all-targets -- -D warnings
      unit_test_command: PROPTEST_CASES=128 cargo test --jobs "${CARGO_BUILD_JOBS:-2}" -p moenarch-audio-analysis-core -p moenarch-audio-analysis-fourier -p moenarch-audio-analysis-io -p moenarch-audio-analysis-pitch -p moenarch-audio-analysis-processing -p moenarch-audio-analysis-recognition -p moenarch-audio-analysis-rhythm -p moenarch-audio-analysis-separation
      cache_cargo: true
      timeout_minutes: 45

  audio-ffmpeg:
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0 && bash scripts/setup_audio_external_tools.sh ffmpeg
      integration_command: FFMPEG_EXTERNAL_TESTS=1 cargo test --jobs "${CARGO_BUILD_JOBS:-2}" -p moenarch-audio-analysis-io --test ffmpeg_decode
      cache_cargo: true
      timeout_minutes: 45

  audio-demucs-smoke:
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0 && AUDIO_DEMUCS_INSTALLER=auto bash scripts/setup_audio_external_tools.sh conda demucs
      integration_command: RUN_REAL_DEMUCS_TESTS=1 cargo test --jobs "${CARGO_BUILD_JOBS:-2}" -p moenarch-audio-analysis-separation real_demucs_smoke_test_when_requested -- --ignored --nocapture
      cache_cargo: true
      timeout_minutes: 90

  audio-perf:
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      benchmark_command: cargo bench --jobs "${CARGO_BUILD_JOBS:-2}" -p moenarch-audio-analysis-core -p moenarch-audio-analysis-fourier -p moenarch-audio-analysis-pitch -p moenarch-audio-analysis-processing -p moenarch-audio-analysis-recognition -p moenarch-audio-analysis-rhythm && python3 scripts/check_audio_bench.py
      cache_cargo: true
      timeout_minutes: 90
      artifact_paths: |
        target/criterion
        .cargo-target/criterion
        benchmark-results
        performance-results
