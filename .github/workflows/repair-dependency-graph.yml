name: Repair dependency graph

on:
  push:
    branches:
      - chore/repository-foundation-v1
    paths:
      - .github/workflows/repair-dependency-graph.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: chore/repository-foundation-v1
      - name: Set up declared repository environment
        run: bash scripts/codex-environment.sh setup
      - name: Regenerate dependency graph
        run: python3 scripts/generate_dependency_chart.py
      - name: Verify generated graph and artifact policy
        run: |
          python3 scripts/generate_dependency_chart.py --check
          bash scripts/check_generated_artifacts.sh
          bash scripts/check_generated_snapshots.sh --only docs/DEPENDENCY_GRAPH.md
      - name: Commit verified generated snapshot
        run: |
          if git diff --quiet -- docs/DEPENDENCY_GRAPH.md; then
            echo "Dependency graph already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPENDENCY_GRAPH.md
          git commit -m "docs: refresh dependency graph"
          git push origin HEAD:chore/repository-foundation-v1
