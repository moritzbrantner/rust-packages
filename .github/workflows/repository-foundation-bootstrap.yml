name: Repository foundation bootstrap

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-foundation-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Bootstrap detected repository foundation
        shell: bash
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/coding-tooling"
          conventions="$RUNNER_TEMP/coding-agent-conventions"
          git clone --quiet https://github.com/moritzbrantner/coding-tooling.git "$tooling"
          git -C "$tooling" checkout --quiet c9e071995abf65d2326930efb05e47e585af0efd
          bun install --cwd "$tooling" --frozen-lockfile
          git clone --quiet https://github.com/moritzbrantner/coding-agent-conventions.git "$conventions"
          git -C "$conventions" checkout --quiet 67977da6df48b2f4b15190e443f8e59ceaa0ef9a
          bun "$tooling/src/cli.ts" bootstrap apply --root "$GITHUB_WORKSPACE" --conventions-root "$conventions"
          git add .coding-tooling.json .conventions
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bootstrap repository foundation"
          git push origin HEAD:chore/repository-foundation-v1
