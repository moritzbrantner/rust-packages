name: Regenerate dependency graph snapshot

on:
  push:
    branches:
      - fix/dependency-graph-snapshot

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Regenerate dependency graph
        run: |
          python3 scripts/generate_dependency_chart.py
          python3 scripts/generate_dependency_chart.py --check
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DEPENDENCY_GRAPH.md
          git commit -m 'docs: refresh dependency graph snapshot'
          git push
