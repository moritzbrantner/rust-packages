name: storybook-ci

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  storybook:
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      working_directory: packages/video-analysis-ui
      bun_version: "1.3.14"
      node_version: ""
      install_command: cd ../.. && bun install --frozen-lockfile
      storybook_build_command: bun run storybook:build
      storybook_test_command: bun run storybook:test:ci
      install_playwright: true
      timeout_minutes: 45
      artifact_paths: |
        packages/video-analysis-ui/storybook-static
        packages/video-analysis-ui/test-results
        packages/video-analysis-ui/playwright-report
