name: workspace-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  rust-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt && rustup default 1.95.0
      format_command: >-
        bun run hygiene:generated &&
        bun run snapshot:check &&
        bun run progress:check &&
        python3 scripts/generate_repository_split_inventory.py --check &&
        python3 scripts/test_generate_repository_split_inventory.py &&
        python3 scripts/test_check_repository_boundaries.py &&
        python3 scripts/check_repository_boundaries.py --check &&
        python3 scripts/test_check_release_plan.py &&
        python3 scripts/check_release_plan.py
        --check docs/repository-split/release-plan.example.json
        --expected-sha d032ad2890c1df3c6a5b9eff024562f00d017fce
        --expected-base-sha d032ad2890c1df3c6a5b9eff024562f00d017fce &&
        cargo fmt --all --check
      lint_command: cargo clippy --workspace --lib --tests --examples -- -D warnings
      unit_test_command: >-
        event_name="${{ github.event_name }}";
        if [ "${event_name}" = "pull_request" ]; then
          base_ref="${{ github.event.pull_request.base.sha }}";
          if [[ ! "${base_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid pull-request base SHA: ${base_ref}" >&2;
            exit 1;
          fi;
          if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base_ref}" || exit 1;
          fi;
          git cat-file -e "${base_ref}^{commit}" 2>/dev/null || exit 1;
        elif [ "${event_name}" = "workflow_dispatch" ]; then
          base_branch="${GITHUB_BASE_REF:-main}";
          base_ref="origin/${base_branch}";
          git fetch --no-tags origin
          "${base_branch}:refs/remotes/${base_ref}" || exit 1;
          git show-ref --verify --quiet "refs/remotes/${base_ref}" || exit 1;
          git cat-file -e "${base_ref}^{commit}" 2>/dev/null || exit 1;
        else
          echo "unsupported workspace-ci event: ${event_name}" >&2;
          exit 1;
        fi;
        BASE_REF="${base_ref}" bun run progress:touched &&
        bun run progress:test &&
        cargo test --jobs "${CARGO_BUILD_JOBS:-2}" --workspace --lib --tests
      build_command: cargo doc --workspace --no-deps
      cache_cargo: true
      timeout_minutes: 60

  frontend-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0
      typecheck_command: bun run ui:typecheck && bun run web:typecheck
      build_command: bun run ui:build && bun run web:build
      unit_test_command: bun run text-wasm:test && bun run text-analysis-wasm:test && bun run text-linguistics-wasm:test && bun run audio-wasm:test && bun run video-wasm:test && bun run ui:test:unit && bun run web:test:unit && bun run web:test:api
      cache_cargo: true
      timeout_minutes: 45

  web-e2e:
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0 && bun run --cwd packages/video-analysis-ui playwright:install
      build_command: bun run ui:build && bun run web:build
      e2e_command: bun run ui:test:e2e && bun run web:test:e2e
      install_playwright: false
      cache_cargo: true
      timeout_minutes: 60
      artifact_paths: |
        packages/video-analysis-ui/playwright-report
        packages/video-analysis-ui/test-results
        prototypes/web/video-analysis-web/playwright-report
        prototypes/web/video-analysis-web/test-results
