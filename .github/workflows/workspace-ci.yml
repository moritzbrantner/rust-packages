name: workspace-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  rust-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: ""
      pre_command: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt && rustup default 1.95.0
      format_command: bun run hygiene:generated && bun run snapshot:check && bun run progress:check && cargo fmt --all --check
      lint_command: cargo clippy --workspace --all-targets -- -D warnings
      unit_test_command: git fetch --no-tags origin "${GITHUB_BASE_REF:-main}" && BASE_REF="origin/${GITHUB_BASE_REF:-main}" bun run progress:touched && bun run progress:test && cargo test --jobs "${CARGO_BUILD_JOBS:-2}" --workspace --all-targets
      build_command: cargo doc --workspace --no-deps
      cache_cargo: true
      timeout_minutes: 60

  frontend-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0
      typecheck_command: bun run ui:typecheck && bun run web:typecheck
      build_command: bun run ui:build && bun run web:build
      unit_test_command: bun run text-wasm:test && bun run text-analysis-wasm:test && bun run text-linguistics-wasm:test && bun run audio-wasm:test && bun run video-wasm:test && bun run maps-wasm:test && bun run ui:test:unit && bun run web:test:unit && bun run web:test:api
      cache_cargo: true
      timeout_minutes: 45

  web-e2e:
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      node_version: ""
      install_command: bun install --frozen-lockfile
      pre_command: rustup target add wasm32-unknown-unknown && cargo install wasm-pack --locked --version 0.14.0
      build_command: bun run ui:build && bun run web:build
      e2e_command: bun run ui:test:e2e && bun run web:test:e2e
      install_playwright: true
      cache_cargo: true
      timeout_minutes: 60
      artifact_paths: |
        packages/video-analysis-ui/playwright-report
        packages/video-analysis-ui/test-results
        prototypes/web/video-analysis-web/playwright-report
        prototypes/web/video-analysis-web/test-results
