[package]
name = "moenarch-video-analysis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line entry point for video-analysis workflows."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "vanalyze"

[lib]
name = "video_analysis_cli"

[[bin]]
name = "vanalyze"
path = "src/main.rs"

[features]
default = []
ffmpeg-tests = []
onnx = ["video-analysis-recognition/onnx", "video-analysis-posture/onnx"]
onnxruntime = ["onnx"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
jobs-core.workspace = true
model-runtime = { workspace = true, features = ["jobs"] }
three-d-processing-core.workspace = true
three-d-processing-io.workspace = true
video-analysis-core.workspace = true
video-analysis-dataset.workspace = true
video-analysis-detectors.workspace = true
video-analysis-ffmpeg.workspace = true
video-analysis-output.workspace = true
video-analysis-posture.workspace = true
video-analysis-posture-io.workspace = true
video-analysis-recognition.workspace = true
video-analysis-split.workspace = true

[dev-dependencies]
tempfile.workspace = true
video-analysis-ffmpeg = { workspace = true, features = ["test-utils"] }
