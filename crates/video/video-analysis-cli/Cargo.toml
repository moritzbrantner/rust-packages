[package]
name = "video-analysis-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vanalyze"
path = "src/main.rs"

[features]
default = []
ffmpeg-tests = []
onnx = ["dep:video-analysis-onnx"]
onnxruntime = ["onnx", "video-analysis-onnx/onnxruntime"]

[dependencies]
clap.workspace = true
serde_json.workspace = true
video-analysis-core.workspace = true
video-analysis-detectors.workspace = true
video-analysis-ffmpeg.workspace = true
video-analysis-models.workspace = true
video-analysis-onnx = { workspace = true, optional = true }
video-analysis-output.workspace = true
video-analysis-split.workspace = true

[dev-dependencies]
tempfile.workspace = true
video-analysis-ffmpeg = { workspace = true, features = ["test-utils"] }
video-analysis-test-support.workspace = true
