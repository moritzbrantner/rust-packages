[package]
name = "video-analysis-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FFmpeg-backed media ingest for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
ffmpeg-backend = []
ffmpeg-tests = ["ffmpeg-backend", "test-utils"]
external-tests = ["ffmpeg-tests"]
test-utils = []

[dependencies]
num-rational.workspace = true
thiserror.workspace = true
video-analysis-core.workspace = true
video-analysis-ingest.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Shared package surface targets.
[[bin]]
name = "video-analysis-ffmpeg-cli"
path = "../../package-surfaces/cli.rs"

[[bin]]
name = "video-analysis-ffmpeg-api"
path = "../../package-surfaces/api.rs"

[[bin]]
name = "video-analysis-ffmpeg-ui"
path = "../../package-surfaces/ui.rs"
