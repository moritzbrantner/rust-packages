[package]
name = "moritzbrantner-geo-io-osm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line adapter for the geo-io-osm library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "geo-io-osm-cli"

[lib]
name = "geo_io_osm_cli"

[[bin]]
name = "geo-io-osm-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
geo-io-geojson.workspace = true
geo-io-osm = { package = "moritzbrantner-geo-io-osm", version = "0.1.0", path = "../geo-io-osm" }
serde_json.workspace = true
runtime-core.workspace = true

[dev-dependencies]
osmpbfreader.workspace = true
protobuf = "2"
tempfile.workspace = true
