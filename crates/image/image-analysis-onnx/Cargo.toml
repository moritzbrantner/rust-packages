[package]
name = "image-analysis-onnx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ONNX-backed still-image preprocessing and inference adapters for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
image-analysis-core.workspace = true
image-analysis-detection.workspace = true
image-analysis-models.workspace = true
image-analysis-processing.workspace = true
ort = { workspace = true, optional = true }
serde_json.workspace = true
video-analysis-core.workspace = true
video-analysis-models.workspace = true

[features]
default = []
onnxruntime = ["dep:ort"]
external-tests = ["onnxruntime"]

[dev-dependencies]
tempfile.workspace = true

# Shared package surface targets.
[[bin]]
name = "image-analysis-onnx-cli"
path = "../../package-surfaces/cli.rs"

[[bin]]
name = "image-analysis-onnx-api"
path = "../../package-surfaces/api.rs"

[[bin]]
name = "image-analysis-onnx-ui"
path = "../../package-surfaces/ui.rs"
