[package]
name = "text-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lightweight semantic text embeddings and search for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
math-sparse-data.workspace = true
ndarray = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
text-core.workspace = true
text-lexical.workspace = true
tokenizers = { workspace = true, optional = true }
vector-analysis-core.workspace = true
vector-analysis-index.workspace = true
video-analysis-core.workspace = true
video-analysis-models = { workspace = true, optional = true }

[features]
default = []
tokenizers = ["dep:tokenizers", "dep:video-analysis-models"]
onnx = ["tokenizers", "dep:ort", "dep:ndarray"]
candle = ["tokenizers", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
external-tests = ["onnx", "candle"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "semantic_index"
harness = false
