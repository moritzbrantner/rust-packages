[package]
name = "text-analysis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP API adapter for the text-analysis library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "text-analysis-server"

[[bin]]
name = "text-analysis-server"
path = "src/main.rs"

[dependencies]
video-analysis-core.workspace = true
clap.workspace = true
serde_json.workspace = true
text-analysis = { workspace = true, features = ["candle"] }
text-model-runtime = { workspace = true, features = ["candle"] }

[features]
default = []
cuda = ["text-analysis/cuda", "text-model-runtime/cuda"]
