[package]
name = "text-linguistics-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP API adapter for the text-linguistics library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "text-linguistics-server"

[[bin]]
name = "text-linguistics-server"
path = "src/main.rs"

[dependencies]
video-analysis-core.workspace = true
clap.workspace = true
serde_json.workspace = true
text-linguistics = { path = "../text-linguistics" }
text-model-runtime = { path = "../text-model-runtime", features = ["candle"] }

[features]
default = []
cuda = ["text-linguistics/cuda", "text-model-runtime/cuda"]
