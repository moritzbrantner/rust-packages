[package]
name = "text-linguistics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local model-backed linguistic analysis pipeline for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
jobs-core.workspace = true
serde_json.workspace = true
text-core.workspace = true
text-lexical.workspace = true
text-transcripts.workspace = true
tokenizers = { workspace = true, optional = true }
video-analysis-core.workspace = true
video-analysis-models.workspace = true

[features]
default = []
tokenizers = ["dep:tokenizers"]
candle = ["tokenizers", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
external-tests = ["candle"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "pipeline"
harness = false
