[package]
name = "text-analysis-linguistics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Heuristic-first linguistic analysis pipeline for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
text-analysis-core.workspace = true
text-analysis-models = { workspace = true, features = ["tokenizers"] }
text-analysis-transcription.workspace = true
video-analysis-core.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "pipeline"
harness = false

# Shared package surface targets.
[[bin]]
name = "text-analysis-linguistics-cli"
path = "../../package-surfaces/cli.rs"

[[bin]]
name = "text-analysis-linguistics-api"
path = "../../package-surfaces/api.rs"

[[bin]]
name = "text-analysis-linguistics-ui"
path = "../../package-surfaces/ui.rs"
