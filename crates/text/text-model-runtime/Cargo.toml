[package]
name = "text-model-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared tokenizer and native text model runtime traits for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, optional = true }
video-analysis-core.workspace = true
model-runtime = { workspace = true, optional = true }

[features]
default = []
model-bundles = ["dep:model-runtime"]
tokenizers = ["dep:tokenizers"]
onnx = ["tokenizers", "dep:ort", "dep:ndarray"]
candle = ["tokenizers", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
cuda = ["candle"]
external-tests = ["onnx", "candle", "model-bundles"]
