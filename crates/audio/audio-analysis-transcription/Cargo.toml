[package]
name = "moritzbrantner-audio-analysis-transcription"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-native audio and video transcription orchestration for video-analysis."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "audio_analysis_transcription"

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
model-runtime = { workspace = true, optional = true }
runtime-core.workspace = true
serde.workspace = true
serde_json.workspace = true
text-transcripts.workspace = true
text-model-runtime = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
video-analysis-core.workspace = true
audio-analysis-speakers = { workspace = true, optional = true }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:text-model-runtime"]
cuda = ["candle", "text-model-runtime/cuda"]
alignment = ["candle", "dep:tokenizers"]
diarization = ["dep:audio-analysis-speakers"]
external-whisperx = []
external-tests = ["external-whisperx"]
model-bundles = ["dep:model-runtime"]

[dev-dependencies]
tempfile.workspace = true
