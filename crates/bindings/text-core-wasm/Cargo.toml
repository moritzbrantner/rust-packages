[package]
name = "text-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM bindings for text-analysis-core."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
text-analysis-core.workspace = true
wasm-bindgen = "0.2.105"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
serde_json.workspace = true

# Shared package surface targets.
[[bin]]
name = "text-core-wasm-cli"
path = "../../package-surfaces/cli.rs"

[[bin]]
name = "text-core-wasm-api"
path = "../../package-surfaces/api.rs"

[[bin]]
name = "text-core-wasm-ui"
path = "../../package-surfaces/ui.rs"
